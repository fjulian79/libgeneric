; libgeneric unit tests, run them on the host with: pio test -e native
;
; This file is only used for testing the library itself, it is not evaluated
; when the library is used as dependency of a project.

[platformio]
src_dir = .

[env:native]
platform = native
; uptime uses the minimal Arduino replacement in test/support
build_src_filter = -<*> +<ringbuffer.cpp> +<fifo.cpp> +<lineringbuffer.cpp> +<crc8.cpp> +<task.cpp>
    +<uptime.cpp>
build_flags = -I. -Itest/support -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all
    -D UNITY_INCLUDE_DOUBLE
test_build_src = yes
